{% extends "base.html" %}
{%block title%} {{block.super}} | Registrati {%endblock title%}
{% block content %}
    <h2>Registrazione</h2>

    <form method="post">
        {% csrf_token %}   <!--Serve per proteggere da attacchi CSFR-->
        {{ form.as_p}}

        <button type="submit">Registrati</button>

    </from>

    <p>
    Hai già un account??
    <a href="{% url 'login' %}">Login</a>
    </p>
{% endblock %}
